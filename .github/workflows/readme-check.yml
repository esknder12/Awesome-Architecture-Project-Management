name: README checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint + GitHub link checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pin to major.minor (3.11) rather than the exact patch: .python-version
      # says 3.11.4, but runner images only ship a subset of patch releases.
      - name: Resolve Python version
        id: py
        run: echo "version=$(cut -d. -f1,2 .python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.py.outputs.version }}
      - name: Test the validator itself
        run: python3 -m unittest discover -s tests -v
      - name: Validate README (structure, TOC, tables, links, assets)
        run: python3 scripts/check_readme.py --strict
      - name: Validate listed GitHub projects and star ordering
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_readme.py --online
